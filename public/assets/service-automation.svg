<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a2e1e"/><stop offset="1" stop-color="#0d4a33"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow5" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.28"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow5)"/>
  <!-- flow nodes -->
  <g>
    <rect x="120" y="170" width="130" height="110" rx="16" fill="url(#g5)"/>
    <rect x="335" y="170" width="130" height="110" rx="16" fill="#134e4a" stroke="#34d399" stroke-width="2"/>
    <rect x="550" y="170" width="130" height="110" rx="16" fill="url(#g5)"/>
    <path d="M250 225 h85 M465 225 h85" stroke="#34d399" stroke-width="3" stroke-dasharray="8 8"/>
    <path d="M328 225 l12 -7 v14 z" fill="#34d399"/>
    <path d="M543 225 l12 -7 v14 z" fill="#34d399"/>
  </g>
  <!-- gear -->
  <g transform="translate(400 225)">
    <circle r="34" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="10 7"/>
    <circle r="14" fill="#34d399"/>
    <circle r="6" fill="#04202e"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <text x="185" y="215">INPUT</text><text x="185" y="240" font-size="12" opacity="0.8">Data</text>
    <text x="400" y="215">PROCESS</text><text x="400" y="240" font-size="12" opacity="0.8">AI Engine</text>
