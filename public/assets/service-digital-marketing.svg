  </g>
  <!-- growth arrow -->
  <path d="M150 330 L300 280 L420 300 L560 220 L680 180" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M680 180 l-26 2 l14 22 z" fill="#fbbf24"/>
  <g fill="#2dd4bf">
    <circle cx="150" cy="330" r="6"/><circle cx="300" cy="280" r="6"/><circle cx="420" cy="300" r="6"/>
    <circle cx="560" cy="220" r="6"/><circle cx="680" cy="180" r="6"/>
  </g>
  <!-- social icons -->
  <g fill="#2dd4bf" opacity="0.6">
    <circle cx="180" cy="120" r="14"/><rect x="620" y="280" width="28" height="28" rx="6"/>
    <path d="M660 100 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
