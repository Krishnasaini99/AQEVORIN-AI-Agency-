<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a2e2a"/><stop offset="1" stop-color="#0d4a42"/>
    </linearGradient>
    <linearGradient id="g8" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow8" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow8)"/>
  <!-- megaphone -->
  <g transform="translate(330 190)">
    <path d="M0 -30 L90 -55 L90 55 L0 30 Z" fill="url(#g8)"/>
    <rect x="-35" y="-20" width="35" height="40" rx="8" fill="#0f766e"/>
