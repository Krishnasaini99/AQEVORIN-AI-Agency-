      <stop offset="0" stop-color="#220a2e"/><stop offset="1" stop-color="#4a1568"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e879f9"/><stop offset="1" stop-color="#8b5cf6"/>
