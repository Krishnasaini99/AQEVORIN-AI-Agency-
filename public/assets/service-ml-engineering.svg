<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a0b2e"/><stop offset="1" stop-color="#3b1d6e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.3"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow2)"/>
  <!-- neural network -->
  <g stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M180 120 L340 180 M180 225 L340 225 M180 330 L340 270"/>
    <path d="M340 180 L500 140 M340 180 L500 225 M340 225 L500 140 M340 225 L500 225 M340 270 L500 225 M340 270 L500 310"/>
    <path d="M500 140 L640 180 M500 225 L640 180 M500 225 L640 270 M500 310 L640 270"/>
  </g>
  <g>
    <circle cx="180" cy="120" r="16" fill="url(#g2)"/><circle cx="180" cy="225" r="16" fill="url(#g2)"/><circle cx="180" cy="330" r="16" fill="url(#g2)"/>
    <circle cx="340" cy="180" r="18" fill="#22d3ee"/><circle cx="340" cy="225" r="18" fill="#22d3ee"/><circle cx="340" cy="270" r="18" fill="#22d3ee"/>
    <circle cx="500" cy="140" r="16" fill="#3b82f6"/><circle cx="500" cy="225" r="16" fill="#3b82f6"/><circle cx="500" cy="310" r="16" fill="#3b82f6"/>
    <circle cx="640" cy="180" r="14" fill="#a855f7"/><circle cx="640" cy="270" r="14" fill="#a855f7"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="600">
    <text x="180" y="80" text-anchor="middle" fill="#c4b5fd">INPUT</text>
    <text x="340" y="140" text-anchor="middle" fill="#c4b5fd">HIDDEN</text>
    <text x="500" y="100" text-anchor="middle" fill="#c4b5fd">HIDDEN</text>
    <text x="640" y="140" text-anchor="middle" fill="#c4b5fd">OUTPUT</text>
  </g>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" letter-spacing="2">MACHINE LEARNING</text>
</svg>
